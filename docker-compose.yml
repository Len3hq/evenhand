# Evenhand — one command to a seeded, working portal:  docker compose up
#
# db   PostgreSQL 16, data in the `pgdata` volume
# api  NestJS; on start: wait for db → migrate → import fixtures + demo data → serve (internal :3001)
# web  Next.js; the only public port (:8080). /api/* is proxied to the api, so the browser,
#      curl and run.py all talk to one origin.
#
# After the images are built once, nothing here needs the network.
# Base images are pinned by multi-arch digest (linux/amd64 + linux/arm64).
#
# Networks: db and api sit on `backend`, which is internal (no route to the internet), so
# "no external API at runtime" is enforced by construction, not just by convention.
# Only web joins `edge` to publish :8080.
name: evenhand

networks:
  backend:
    internal: true
  edge: {}

services:
  db:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: evenhand
      POSTGRES_PASSWORD: evenhand
      POSTGRES_DB: evenhand
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evenhand -d evenhand']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: evenhand-api:local
    environment:
      DATABASE_URL: postgresql://evenhand:evenhand@db:5432/evenhand
      PORT: '3001'
      # Demo mode seeds fixed test tokens and passwords and prints them on boot.
      # Set to "false" for a real event: demo tokens are then refused.
      DEMO_MODE: 'true'
      DEMO_PASSWORD: evenhand-demo
      ALLOWED_ORIGINS: http://localhost:8080
      RATE_LIMIT_DEFAULT_PER_MIN: '300'
      RATE_LIMIT_LOGIN_PER_MIN: '10'
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Baked into the Next.js build (rewrites are fixed at build time).
        API_REWRITE_TARGET: http://api:3001
    image: evenhand-web:local
    environment:
      # Used at request time by server components.
      API_INTERNAL_URL: http://api:3001
    ports:
      - '8080:8080'
    networks: [backend, edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
