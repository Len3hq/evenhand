name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format · lint · typecheck · unit · e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evenhand
          POSTGRES_PASSWORD: evenhand
          POSTGRES_DB: evenhand
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U evenhand" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://evenhand:evenhand@localhost:5433/evenhand
      TEST_DATABASE_URL: postgresql://evenhand:evenhand@localhost:5433/evenhand_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The service container replaces `npm run db:up`, so call the workspace script directly.
      - run: npm run test:e2e -w @evenhand/api
      - run: npm run build

  acceptance:
    name: docker compose up + run.py
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: SKIP_UP=1 sh tests/acceptance/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: acceptance-report.txt
      - if: failure()
        run: docker compose logs --no-color
