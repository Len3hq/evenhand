# Development overlay, used only by the npm scripts (`npm run db:up`, `npm run dev`):
#   docker compose -f docker-compose.yml -f compose.dev.yml up -d db
# It publishes Postgres on host port 5433 so the api and tests can run on the host with
# hot reload. It is deliberately NOT named docker-compose.override.yml, which plain
# `docker compose up` would pick up automatically.
services:
  db:
    # Published ports need a non-internal network.
    networks: [backend, edge]
    ports:
      - '5433:5432'
